name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-typescript:
    name: contract / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm check:versions

      - run: pnpm gen:schema

      - name: generated schema is in sync
        run: git diff --exit-code

      - run: pnpm typecheck

      - run: pnpm validate:fixtures

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - run: uv sync --dev --locked --no-config --default-index https://pypi.org/simple

      - run: uv run --locked --no-config --default-index https://pypi.org/simple ruff format --check src tests ../tools

      - run: uv run --locked --no-config --default-index https://pypi.org/simple ruff check src tests ../tools

      - run: uv run --locked --no-config --default-index https://pypi.org/simple pytest

  rust:
    name: rust / lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -p cs2df --check

      - run: cargo clippy -p cs2df --all-targets --no-deps -- -D warnings

      - run: cargo test --workspace

      - name: validate fixtures/v3-mid with cs2df
        run: |
          cargo build --release -p cs2df
          (cd fixtures/v3-mid && zip -q /tmp/v3-mid.zip *.json)
          ./target/release/cs2df validate /tmp/v3-mid.zip --strict

  rust-build-matrix:
    name: rust / build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p cs2df --target ${{ matrix.target }}
