name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-typescript:
    name: contract / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm check:versions

      - run: pnpm gen:schema

      - name: generated schema is in sync
        run: git diff --exit-code

      - run: pnpm typecheck

      - run: pnpm validate:fixtures

      - run: pnpm test:parser

  rust:
    name: rust / lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo fmt -p cs2df --check

      - run: cargo clippy -p cs2df --all-targets --no-deps -- -D warnings

      - run: cargo test --workspace

      - name: validate fixtures/v3-mid with cs2df
        run: |
          cargo build --release -p cs2df
          ./target/release/cs2df --version
          (cd fixtures/v3-mid && zip -q /tmp/v3-mid.zip *.json)
          ./target/release/cs2df validate /tmp/v3-mid.zip --strict

  rust-build-matrix:
    name: rust / build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo build --release -p cs2df --target ${{ matrix.target }}

      - name: binary smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/cs2df --version
          (cd fixtures/v3-mid && zip -q /tmp/v3-mid.zip *.json)
          ./target/${{ matrix.target }}/release/cs2df validate /tmp/v3-mid.zip --strict

      - name: binary smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/${{ matrix.target }}/release/cs2df.exe --version
          Compress-Archive -Path fixtures/v3-mid/*.json -DestinationPath $env:TEMP/v3-mid.zip -Force
          ./target/${{ matrix.target }}/release/cs2df.exe validate $env:TEMP/v3-mid.zip --strict
